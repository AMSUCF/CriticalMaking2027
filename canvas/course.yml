site_base: https://anastasiasalter.net/CriticalMaking2027
timezone: America/New_York      # informational: the deployer always uses America/New_York
syllabus_file: index.md
welcome_file: welcome.md        # repo-root md -> page "Welcome! (Read this first!)", first item of the first week
course_image: course_image.png  # dashboard card (relative to canvas/); source: tools/course_image.html
assignment_groups: {exercises: Making Exercises, other: Course Requirements}
weeks: [exercises/introductions, exercises/one_selfie, exercises/two_comic, exercises/three_gifs,
        exercises/four_maps, exercises/five_hypertext, exercises/six_game, exercises/seven_generator,
        exercises/eight_analysis, exercises/nine_generation, exercises/ten_code,
        exercises/eleven_narrative, exercises/twelve_combinations, exercises/thirteen_tools]
extra: [exercises/reflection]
breaks:
  - {module: "Week Ten: Spring Break", week_start: 2027-03-15, after: exercises/eight_analysis,
     text: "Enjoy the break! No readings or exercises this week."}
activity_verification: {name: "Activity Verification", points: 3, open: 2027-01-11, due: 2027-01-15,
                        module_of: exercises/introductions}
rubric:
  title: "Making Exercise Rubric"
  criteria:
    - {description: "Process documentation", long: "Approximately five images documenting your making process, with a short narrative.", points: 3}
    - {description: "Engagement with readings", long: "Cites and engages at least two works from this module.", points: 2}
    - {description: "Peer responses", long: "At least two thoughtful replies to classmates.", points: 2}

